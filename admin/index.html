<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | EWA</title>
  <link rel="icon" href="/images/logo.jpg" />
</head>
<body>
  <!--
    decap-cms-app (the full bundle — core alone lacks React/prop-types
    the Nexus Gateway backend BEFORE CMS.init() runs. See
    nexus-gateway-backend.js and config.yml's backend block
    (name: nexus-gateway).
  -->
  <script src="https://unpkg.com/decap-cms-app@^3.0.0/dist/decap-cms-app.js"></script>
  <script src="nexus-gateway-backend.js"></script>
  <script>
    CMS.registerBackend("nexus-gateway", window.NexusGatewayBackend);
    CMS.init();
  </script>
</body>
</html>
