<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | EWA</title>
  <link rel="icon" href="/images/logo.jpg" />
</head>
<body>
  <!--
    decap-cms.js is the fully-bundled build: React, ReactDOM, all standard
    widgets, and all built-in backends are inside it. Do NOT load React
    separately — the bundle carries its own and will crash on a version
    mismatch.

    CMS_MANUAL_INIT defers CMS.init() so we can register the Nexus Gateway
    backend BEFORE the config is read. Without it, decap-cms.js calls
    CMS.init() immediately on load and the custom backend is never seen.

    Load order matters: set CMS_MANUAL_INIT first, then decap-cms.js,
    then our backend file, then register + init.
  -->
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="nexus-gateway-backend.js"></script>
  <script>
    CMS.registerBackend("nexus-gateway", window.NexusGatewayBackend);
    CMS.init();
  </script>
</body>
</html>
